<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonlit Labs</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap");
    :root {
      --gate-bg: #050716;
      --gate-panel: rgba(12, 18, 42, 0.76);
      --gate-text: #f4f7ff;
      --gate-muted: #9aa7cc;
      --gate-blue: #60a5fa;
      --gate-purple: #a78bfa;
      --gate-border: rgba(147, 197, 253, 0.22);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 12% 10%, rgba(96, 165, 250, 0.28), transparent 30rem),
        radial-gradient(circle at 86% 12%, rgba(167, 139, 250, 0.24), transparent 28rem),
        linear-gradient(180deg, #050716, #02030a);
      color: var(--gate-text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body.moonlit-unlocked {
      background: #050716;
    }
    .gate-wrap {
      width: min(980px, 92vw);
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-items: center;
      padding: 48px 0;
    }
    .gate-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--gate-border);
      border-radius: 8px;
      background: var(--gate-panel);
      box-shadow: 0 30px 120px rgba(0, 0, 0, 0.38);
      padding: clamp(28px, 5vw, 56px);
    }
    .gate-card::after {
      content: "";
      position: absolute;
      right: -90px;
      top: -90px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: #dbeafe;
      box-shadow: 0 0 90px rgba(219, 234, 254, 0.56);
      opacity: 0.9;
    }
    .gate-content {
      position: relative;
      z-index: 1;
      max-width: 620px;
    }
    .gate-kicker {
      margin: 0 0 14px;
      color: var(--gate-blue);
      font: 800 11px/1.3 "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--gate-text);
      font-size: clamp(50px, 9vw, 112px);
      line-height: 0.88;
      letter-spacing: 0;
    }
    .gate-copy {
      max-width: 560px;
      margin: 24px 0 0;
      color: var(--gate-muted);
      font-size: 18px;
      line-height: 1.6;
    }
    .gate-form {
      display: grid;
      gap: 12px;
      max-width: 420px;
      margin-top: 32px;
    }
    label {
      color: #dbeafe;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      border: 1px solid var(--gate-border);
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.66);
      color: var(--gate-text);
      padding: 13px 14px;
      font: 700 16px/1.3 "JetBrains Mono", ui-monospace, monospace;
      outline: none;
    }
    input:focus {
      border-color: var(--gate-blue);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.16);
    }
    button {
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gate-blue), var(--gate-purple));
      color: #050716;
      cursor: pointer;
      font-weight: 900;
      padding: 13px 18px;
    }
    .gate-message {
      min-height: 20px;
      margin: 4px 0 0;
      color: #fca5a5;
      font-size: 13px;
      font-weight: 700;
    }
    #moonlit-app {
      min-height: 100vh;
    }
    .moonlit-project-view {
      min-height: 100vh;
      background: #050716;
    }
    .moonlit-project-toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px min(4vw, 28px);
      border-bottom: 1px solid rgba(147, 197, 253, 0.18);
      background: rgba(5, 7, 22, 0.9);
      backdrop-filter: blur(14px);
    }
    .moonlit-project-toolbar strong {
      color: #dbeafe;
    }
    .moonlit-project-toolbar button {
      padding: 9px 12px;
      border: 1px solid rgba(147, 197, 253, 0.28);
      background: rgba(15, 23, 42, 0.85);
      color: #dbeafe;
    }
    .moonlit-project-frame {
      width: 100%;
      min-height: calc(100vh - 55px);
      border: 0;
      display: block;
      background: #050716;
    }
  </style>
</head>
<body>
  <main id="moonlit-app">
    <div class="gate-wrap">
      <section class="gate-card" aria-labelledby="moonlit-title">
        <div class="gate-content">
          <p class="gate-kicker">Private Static Workspace</p>
          <h1 id="moonlit-title">Moonlit Labs</h1>
          <p class="gate-copy">Enter the layer-one password to decrypt the internal Moonlit Labs workspace from its published encrypted datastream.</p>
          <form class="gate-form" data-moonlit-gate>
            <label for="moonlit-password">Workspace Password</label>
            <input id="moonlit-password" name="password" type="password" autocomplete="current-password" autofocus />
            <button type="submit">Decrypt Workspace</button>
            <p class="gate-message" data-gate-message></p>
          </form>
        </div>
      </section>
    </div>
  </main>
  <script src="assets/js/moonlit-loader.js"></script>
</body>
</html>
