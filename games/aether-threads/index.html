<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER THREADS - AAA Engine Profile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 40px;
            background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.8) 100%);
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stats {
            text-align: right;
            margin-left: auto;
        }

        .stat-box {
            margin-bottom: 15px;
        }

        .stat-label {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .energy-bar-container {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 5px;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.5) inset;
        }

        #energy-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            box-shadow: 0 0 15px #0ff;
            transition: width 0.1s linear, background 0.3s ease;
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .crosshair::before {
            content: '';
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
        }

        #start-screen, #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        #game-over {
            display: none;
            background: rgba(10, 0, 0, 0.9);
            z-index: 200;
        }
        
        #game-over h2 {
            color: #ff0055;
            font-size: 4rem;
            letter-spacing: 10px;
            text-shadow: 0 0 30px #ff0055;
            margin: 0 0 10px 0;
        }

        .play-btn {
            padding: 15px 40px;
            border: 2px solid #0ff;
            background: transparent;
            color: #0ff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2), inset 0 0 10px rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .play-btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.6);
        }

        .damage-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            box-shadow: inset 0 0 150px rgba(255, 0, 0, 0);
            z-index: 5;
            pointer-events: none;
            transition: box-shadow 0.2s ease;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="font-size: 5rem; margin:0; letter-spacing: 15px; text-shadow: 0 0 30px #0ff;">AETHER THREADS</h1>
        <p style="font-size: 1.2rem; color: #aaa; max-width: 600px; text-align: center; margin-top: 20px;">
            Navigate the geometric quantum tunnel. <br>Steer with your <span style="color: #fff; font-weight: bold;">GAMEPAD LEFT JOYSTICK</span> or Arrow Keys/WASD.<br><br>
            Press <span style="color: #0ff; font-weight: bold;">A BUTTON</span> or Space/Enter to connect.
        </p>
        <button class="play-btn" id="init-btn">INITIALIZE</button>
    </div>

    <div id="game-over">
        <h2>SIGNAL LOST</h2>
        <p id="final-score" style="font-size: 2rem; color: #fff; margin: 0;">SCORE: 0</p>
        <button class="play-btn" id="reboot-btn">REBOOT</button>
    </div>

    <div class="damage-overlay" id="damage-vignette"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Velocity</div>
                    <div class="stat-value" id="speed-val">0.000c</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Data Integration</div>
                    <div class="stat-value" id="score-val">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Core Stability</div>
                    <div class="energy-bar-container">
                        <div id="energy-bar"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="crosshair"></div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    
    <script src="game.js"></script>
</body>
</html>
