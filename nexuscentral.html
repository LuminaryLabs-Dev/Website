<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusCentral | Democratizing AI Workflows</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        nexus: {
                            bg: '#F8FAFC', // slate-50
                            text: '#0F172A', // slate-900
                            muted: '#64748B', // slate-500
                            primary: '#2563EB', // blue-600
                            secondary: '#7C3AED', // violet-600
                            accent: '#0EA5E9', // sky-500
                            surface: '#FFFFFF',
                            border: '#E2E8F0'
                        }
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'progress': 'progress 1.5s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        progress: {
                            '0%': { width: '0%' },
                            '100%': { width: '73.8%' } /* 18450 / 25000 */
                        }
                    }
                }
            }
        }
    </script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.4;
        }

        .gradient-text {
            background: linear-gradient(135deg, #2563EB, #7C3AED, #0EA5E9);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-x 4s linear infinite;
        }

        @keyframes gradient-x {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .organic-shape {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }

        .app-screenshot-placeholder {
            box-shadow: 0 25px 50px -12px rgba(37, 99, 235, 0.25);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(226, 232, 240, 0.8);
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16/10;
            overflow: hidden;
        }

        .app-screenshot-placeholder:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 30px 60px -12px rgba(124, 58, 237, 0.3);
        }

        .app-screenshot-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Diagonal section backgrounds */
        .skew-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #FFFFFF;
            transform: skewY(-3deg);
            transform-origin: top left;
            z-index: -1;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) skewX(-12deg);
            }

            100% {
                transform: translateX(200%) skewX(-12deg);
            }
        }
    </style>
</head>

    <script>
        // Render Function
        function renderPage() {
            const data = NEXUS_CENTRAL_DATA;

            // Hero

            document.getElementById('early-access-note').textContent = `Join ${data.hero.earlyAccessCount} developers testing NexusCentral before the ${data.hero.releaseDate} release.`;

            // Fundraiser
            const progress = (data.fundraiser.raised / data.fundraiser.goal) * 100;
            document.getElementById('fundraiser-card').innerHTML = `
                <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#2563EB 1px, transparent 1px); background-size: 20px 20px;"></div>
                <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-8">
                    <div class="flex-1 w-full">
                        <div class="flex justify-between items-end mb-4">

                                <h2 class="text-2xl font-bold text-nexus-text">${data.fundraiser.title}</h2>
                                <p class="text-nexus-muted mt-1">${data.fundraiser.description}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-3xl font-extrabold text-nexus-primary">${data.fundraiser.currency}${data.fundraiser.raised.toLocaleString()}</span>
                                <span class="text-nexus-muted font-medium block">raised of ${data.fundraiser.currency}${data.fundraiser.goal.toLocaleString()} goal</span>
                            </div>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-6 border border-slate-200 overflow-hidden relative">
                            <div class="absolute top-0 left-0 h-full bg-gradient-to-r from-nexus-primary to-nexus-accent rounded-full animate-progress" style="width: ${progress}%;"></div>
                            <div class="absolute top-0 left-0 h-full w-full bg-white/20 transform -skew-x-12 -translate-x-full animate-[shimmer_2s_infinite]"></div>
                        </div>
                        <div class="flex justify-between mt-2 text-xs font-bold text-slate-400 uppercase tracking-wider">
                            <span>Started</span>
                            <span>${progress.toFixed(1)}% Funded</span>
                            <span>${data.fundraiser.currency}${data.fundraiser.goal / 1000}k</span>
                        </div>
                    </div>
                    <div class="w-full md:w-auto flex-shrink-0">
                        <button class="w-full md:w-auto px-8 py-4 bg-[#635BFF] hover:bg-[#4B45C6] text-white rounded-xl font-bold text-lg transition-all shadow-lg shadow-[#635BFF]/30 hover:shadow-[#635BFF]/50 hover:-translate-y-1 flex items-center justify-center gap-3">
                            <svg class="w-6 h-6" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M19.9805 40C31.0262 40 39.9805 31.0457 39.9805 20C39.9805 8.95431 31.0262 0 19.9805 0C8.93478 0 -0.0195312 8.95431 -0.0195312 20C-0.0195312 31.0457 8.93478 40 19.9805 40Z" fill="currentColor"/>
                                <path d="M22.0625 15.6875C22.0625 14.5 21.0312 13.625 19.4688 13.625C17.6562 13.625 16.25 14.7812 16.25 16.5938C16.25 19.7812 25.1875 18.25 25.1875 23.5938C25.1875 26.6562 22.8438 29.0312 19.2812 29.0312C15.9375 29.0312 13.3438 27.2812 12.3125 24.5L15.5312 22.8438C16.125 24.625 17.5625 25.8125 19.3438 25.8125C21.125 25.8125 22.0625 24.9688 22.0625 23.875C22.0625 20.3125 13.125 22 13.125 16.6562C13.125 13.7812 15.6875 10.9688 19.4688 10.9688C22.25 10.9688 24.5938 12.4375 25.5 14.5312L22.0625 15.6875Z" fill="white"/>
                            </svg>

            `;

            // Features
            const featuresHtml = data.features.map(f => `
                <div class="relative py-24 reveal">
                    ${f.skew ? `<div class="skew-bg" style="${f.skewConfig || ''}"></div>` : ''}
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex flex-col lg:flex-row${f.reverse ? '-reverse' : ''} items-center gap-16">

                                <div class="w-14 h-14 rounded-2xl ${f.iconColor} flex items-center justify-center mb-6 shadow-inner">
                                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${f.iconPath}"></path></svg>
                                </div>
                                <h3 class="text-4xl font-extrabold mb-6 text-nexus-text">${f.title}</h3>
                                <p class="text-xl text-nexus-muted leading-relaxed mb-6 font-light">

                                ${f.points && f.points.length > 0 ? `
                                    <ul class="space-y-4 font-medium text-nexus-text mt-8">

                                            <p class="text-sm text-nexus-muted">${f.note.text}</p>

                            <div class="flex-1 w-full perspective-1000">

            `).join('');
            document.getElementById('features-container').innerHTML = featuresHtml;

            // Footer
            document.getElementById('footer-subtitle').textContent = data.hero.subtitle;
            document.getElementById('copyright-text').textContent = data.footer.copy;
            document.getElementById('footer-links').innerHTML = data.footer.links.map(l => `
                <a href="${l.href}" class="hover:text-nexus-primary transition-colors">${l.label}</a>
            `).join('');

            // Re-trigger reveal after content injection
            reveal();
        }

        // Scroll Reveal Logic
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                var elementVisible = 100;
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                }
            }
        }
        window.addEventListener("scroll", reveal);

        // Three.js Logic (Same as before but moved to end)
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0xF8FAFC, 0.0012);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.z = 800;
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particleCount = 200;
        const maxDistance = 180;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);
        const particleVelocities = [];
        const colorPrimary = new THREE.Color(0x2563EB);
        const colorSecondary = new THREE.Color(0x7C3AED);

        for (let i = 0; i < particleCount; i++) {
            particlePositions[i * 3] = (Math.random() - 0.5) * 2500;
            particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 2500;
            particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 1000;
            const mixedColor = Math.random() > 0.4 ? colorPrimary : colorSecondary;
            particleColors[i * 3] = mixedColor.r;
            particleColors[i * 3 + 1] = mixedColor.g;
            particleColors[i * 3 + 2] = mixedColor.b;
            particleVelocities.push({
                x: (Math.random() - 0.5) * 0.5,
                y: (Math.random() - 0.5) * 0.5,
                z: (Math.random() - 0.5) * 0.5
            });
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
        const particleMaterial = new THREE.PointsMaterial({ size: 4, transparent: true, opacity: 0.6, vertexColors: true, sizeAttenuation: true });
        const particleSystem = new THREE.Points(particlesGeometry, particleMaterial);
        scene.add(particleSystem);

        const linesGeometry = new THREE.BufferGeometry();
        const linesMaterial = new THREE.LineBasicMaterial({ color: 0x94A3B8, transparent: true, opacity: 0.15 });
        let linePositions = new Float32Array(particleCount * particleCount * 3);
        linesGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        const linesMesh = new THREE.LineSegments(linesGeometry, linesMaterial);
        scene.add(linesMesh);

        let mouseX = 0, mouseY = 0;
        const targetObj = new THREE.Vector3();
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);
            scene.rotation.y += 0.0005;
            scene.rotation.x += 0.0002;
            const positions = particleSystem.geometry.attributes.position.array;
            targetObj.x = mouseX * 1200;
            targetObj.y = mouseY * 1200;
            targetObj.z = 200;
            let vertexpos = 0, numConnected = 0;
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] += particleVelocities[i].x;
                positions[i * 3 + 1] += particleVelocities[i].y;
                positions[i * 3 + 2] += particleVelocities[i].z;
                if (Math.abs(positions[i * 3]) > 1250) particleVelocities[i].x *= -1;
                if (Math.abs(positions[i * 3 + 1]) > 1250) particleVelocities[i].y *= -1;
                if (Math.abs(positions[i * 3 + 2]) > 500) particleVelocities[i].z *= -1;
                const dxMouse = positions[i * 3] - targetObj.x;
                const dyMouse = positions[i * 3 + 1] - targetObj.y;
                const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                if (distMouse < 300) {
                    const force = (300 - distMouse) / 300;
                    positions[i * 3] += dxMouse * force * 0.03;
                    positions[i * 3 + 1] += dyMouse * force * 0.03;
                }
            }
            for (let i = 0; i < particleCount; i++) {
                for (let j = i + 1; j < particleCount; j++) {
                    const dx = positions[i * 3] - positions[j * 3];
                    const dy = positions[i * 3 + 1] - positions[j * 3 + 1];
                    const dz = positions[i * 3 + 2] - positions[j * 3 + 2];
                    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
                    if (dist < maxDistance) {
                        linePositions[vertexpos++] = positions[i * 3];
                        linePositions[vertexpos++] = positions[i * 3 + 1];
                        linePositions[vertexpos++] = positions[i * 3 + 2];
                        linePositions[vertexpos++] = positions[j * 3];
                        linePositions[vertexpos++] = positions[j * 3 + 1];
                        linePositions[vertexpos++] = positions[j * 3 + 2];
                        numConnected++;
                    }
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            linesMesh.geometry.setDrawRange(0, numConnected * 2);
            linesMesh.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Form Interaction
        document.getElementById('earlyAccessForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const textSpan = btn.querySelector('.btn-text');
            btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span class="btn-text">Access Granted</span>`;
            btn.classList.replace('bg-nexus-primary', 'bg-emerald-500');
            setTimeout(() => {
                this.reset();
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg> <span class="btn-text">Request Access</span>`;
                btn.classList.replace('bg-emerald-500', 'bg-nexus-primary');
            }, 3000);
        });

        // Initialize
        window.onload = function () {
            renderPage();
            animate();
        };
    </script>
</body>
