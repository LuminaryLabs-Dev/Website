<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shader Library — Luminary Labs</title><link rel="stylesheet" href="/assets/css/shader-renderer.css"><link rel="stylesheet" href="/assets/css/shader-library.css?v=20260922-library-3"><style>body{margin:0;background:#f3f3ee;color:#17212b;font:16px/1.5 system-ui}header,main{max-width:1400px;margin:auto;padding:24px}h1{margin:12px 0}a{color:#24664e}nav{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0}nav a{padding:10px 0}nav a[aria-current]{font-weight:700;border-bottom:2px solid}.presentation-visual{height:min(55vw,554px);min-height:300px;position:relative;background:#130820}.page-scene,.scene-renderer,.scene-poster{position:absolute;inset:0;width:100%;height:100%}.scene-poster{object-fit:cover}.page-scene[data-state=ready] .scene-poster{visibility:hidden}.presentation-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;gap:16px}.motion-toggle{min-height:44px;background:none;border:1px solid #65746a;padding:8px 16px;font:inherit}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin-top:30px}#cards img{width:100%;display:block}#cards a{text-decoration:none}#cards strong{display:block;margin:8px 0}.scene-status{max-width:320px}</style></head><body><header><a href="/">← Luminary Labs</a><h1>Shader library</h1><p>Click or tap the scene to see the next one, or let the category play on shuffle.</p><nav aria-label="Shader categories" id="categories"></nav></header><main><section class="presentation-hero"><div class="presentation-visual"><div class="page-scene" data-shader-category="opensource" data-ambient><img class="scene-poster" alt="" src="/public/scenes/fractals/living-lightning.webp" width="1440" height="554"></div></div><div class="presentation-actions"><button class="motion-toggle" data-motion-toggle hidden type="button">Pause motion</button></div></section><div id="cards"></div></main><script src="/assets/js/shader-library.js?v=20260922-library-3"></script><script>
const params=new URLSearchParams(location.search);const category=ShaderLibrary.categories.some(c=>c[0]===params.get('category'))?params.get('category'):'opensource';document.querySelector('[data-shader-category]').dataset.shaderCategory=category;
for(const [id,name]of ShaderLibrary.categories){const a=document.createElement('a');a.href='?category='+id;a.textContent=name;if(id===category)a.setAttribute('aria-current','page');document.getElementById('categories').append(a);}
for(const entry of ShaderLibrary.forCategory(category)){const a=document.createElement('a');a.href='?category='+category+'&scene='+entry.id;const img=document.createElement('img');img.src=entry.poster;img.alt='';img.loading='lazy';const label=document.createElement('strong');label.textContent=entry.name;a.append(img,label);document.getElementById('cards').append(a);}
document.querySelector('.scene-poster').src=ShaderLibrary.forCategory(category)[0].poster;
</script><script src="/assets/js/shader-renderer.js?v=20260908-loading-1"></script><script src="/assets/js/site-motion.js?v=20260906-unified-1"></script><script src="/assets/js/shader-bloom.js?v=20260922-library-3"></script><script src="/assets/js/page-scenes.js?v=20260922-library-3"></script></body></html>
