<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Three.js Demo — Luminary Labs</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      .demo-wrap {
        height: calc(100vh - 76px);

        width: 100%;
        height: 100%;
        display: block;

    <header class="site-header">

      <section class="page-hero">
